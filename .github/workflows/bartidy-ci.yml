name: BarTidy CI

on:
  pull_request:
  push:
    branches: [development, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bartidy-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository == 'zhenkun26/BarTidy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - name: Check source lists and resource syntax
        run: |
          bash scripts/generate-swiftlint-inputs.sh "$RUNNER_TEMP/swiftlint-inputs.xcfilelist"
          diff -u scripts/swiftlint-inputs.xcfilelist "$RUNNER_TEMP/swiftlint-inputs.xcfilelist"
          python3 - <<'PY'
          import json, pathlib, plistlib, xml.etree.ElementTree as ET
          for path in pathlib.Path('Thaw').rglob('*.xcstrings'):
              json.loads(path.read_text())
          with open('Thaw/Resources/Info.plist', 'rb') as source:
              info = plistlib.load(source)
          assert info['BarTidyUpdatesEnabled'] is False
          assert info['SUEnableAutomaticChecks'] is False
          assert 'SUFeedURL' not in info and 'SUPublicEDKey' not in info
          ET.parse('Thaw.xcodeproj/xcshareddata/xcschemes/Thaw.xcscheme')
          PY
          bash -n scripts/test-bartidy.sh
          git diff --check
      - name: SwiftLint
        run: |
          docker run -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint:0.63.3@sha256:b70b763c949399cc3e4fdcfbc7588944d9503d498b6d96e853dfa07a944256e6 \
            swiftlint lint --strict

  build-and-test:
    if: github.repository == 'zhenkun26/BarTidy'
    needs: lint
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: bartidy-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.resolved') }}
      - name: Report toolchain
        run: xcodebuild -version
      - name: Build Debug and run isolated regression suites
        run: bash scripts/test-bartidy.sh "$RUNNER_TEMP/BarTidy-Debug"
      - name: Build Release without distribution signing
        run: |
          xcodebuild build -project Thaw.xcodeproj -scheme Thaw \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/BarTidy-Release" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BarTidy-Debug/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES
      - name: Preserve test and build results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bartidy-validation
          path: |
            ${{ runner.temp }}/BarTidy-Debug/Results-*.xcresult
            ${{ runner.temp }}/BarTidy-Debug/Logs
            ${{ runner.temp }}/BarTidy-Release/Logs
          if-no-files-found: warn
          retention-days: 7
